<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>树洞 · Tree Hole</title>
  <meta name="description" content="树洞 Tree Hole —— 把心事说给树听的匿名留言小站，内容只保存在你自己的浏览器里。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F6B4F'/%3E%3Cpath d='M24 7c-9 0-15 4.6-15 12 0 2 .7 3.8 1.8 5.2C13.6 18 18 14 24 11.7c-5 3.4-8.8 7.3-10.9 13' stroke='%237BC29A' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <div class="leaf-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M19.5 3.5c-8.2 0-13.6 4.2-13.6 11 0 1.9.6 3.5 1.6 4.8 3-6 7.2-9.6 12.2-11.6-4.2 3-7.4 6.4-9.4 11.4 1.1.5 2.3.7 3.6.7 6.2 0 9.6-6.2 9.6-16.3Z" fill="#FFFFFF"/>
          </svg>
        </span>
        <div class="brand__text">
          <h1 class="brand__title">树洞 <span>Tree&nbsp;Hole</span></h1>
          <p class="brand__subtitle">把心事说给树听</p>
        </div>
      </div>
      <span class="voice-pill"><strong id="voiceCount">0</strong> 条声音</span>
    </div>
  </header>

  <main class="page-shell">
    <form class="composer" id="composerForm" novalidate>
      <label class="sr-only" for="postContent">写下你的心事</label>
      <textarea id="postContent" name="content" rows="4" maxlength="300"
                placeholder="这里没有熟人，说说今天的事……"></textarea>
      <div class="composer__footer">
        <span class="char-count" id="charCount" aria-live="polite">0 / 300</span>
        <button class="btn-primary" id="submitBtn" type="submit" disabled>投进树洞</button>
      </div>
    </form>

    <section class="timeline" aria-labelledby="timelineTitle">
      <div class="timeline__head">
        <h2 id="timelineTitle">洞里的声音</h2>
        <span class="timeline__hint">最新在前</span>
      </div>

      <ul class="post-list" id="postList"></ul>

      <div class="empty" id="emptyState">
        <svg class="empty__tree" viewBox="0 0 160 140" role="img" aria-label="一棵安静的树">
          <defs>
            <linearGradient id="canopyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7BC29A"/>
              <stop offset="100%" stop-color="#2F6B4F"/>
            </linearGradient>
          </defs>
          <ellipse cx="80" cy="130" rx="44" ry="6" fill="#2F6B4F" opacity="0.08"/>
          <path d="M80 128V84" stroke="#4C9A73" stroke-width="5" stroke-linecap="round"/>
          <path d="M80 100l-14-10M80 108l14-11" stroke="#4C9A73" stroke-width="3" stroke-linecap="round"/>
          <circle cx="80" cy="60" r="33" fill="url(#canopyGrad)" opacity="0.92"/>
          <circle cx="51" cy="76" r="21" fill="url(#canopyGrad)" opacity="0.72"/>
          <circle cx="109" cy="78" r="19" fill="url(#canopyGrad)" opacity="0.66"/>
          <circle cx="82" cy="38" r="17" fill="#7BC29A" opacity="0.65"/>
        </svg>
        <h3>这里还很安静</h3>
        <p>说第一句吧，树会替你记着。</p>
      </div>
    </section>

    <footer class="site-footer">
      <p>内容仅保存在此设备的浏览器中，不会上传到任何地方。</p>
      <p class="site-footer__meta">Tree Hole · 原生 HTML / CSS / JavaScript</p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
